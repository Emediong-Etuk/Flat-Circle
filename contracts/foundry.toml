[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
# Robinhood Chain (Arbitrum) allows 96 KB contracts; the factory embeds FlatCircle's init code.
code_size_limit = 98304
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 2048

[rpc_endpoints]
robinhood = "${RPC_URL}"

[lint]
# Public immutables keep lowercase names on purpose: they are the ABI getters the frontend reads.
exclude_lints = ["screaming-snake-case-immutable"]
# Lint production code strictly; tests use deliberate casts, bit shifts and raw transfers.
ignore = ["test/**/*.sol", "script/**/*.sol"]

[fmt]
line_length = 110
